<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>London Climbing Gym Prices</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

<!-- Optional account sync (Firebase). Harmless if not configured. -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#1f232c; --ink:#e8ebf0; --mut:#9aa3b2;
    --line:#2a2f3a; --accent:#5db07a; --accent2:#e2a13c; --warn:#c96a5a; --chip:#262b35;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink)}
  header{padding:22px 20px 12px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:22px}
  .sub{color:var(--mut);font-size:13px;margin-top:4px}
  .wrap{max-width:960px;margin:0 auto;padding:18px 20px 60px}
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;
            background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:18px 0}
  .ctl{display:flex;flex-direction:column;gap:4px}
  .ctl label{font-size:12px;color:var(--mut)}
  input,select,button{font:inherit;color:var(--ink);background:var(--card2);
       border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  button{cursor:pointer;background:var(--accent);color:#06210f;border:none;font-weight:600}
  button.ghost{background:var(--chip);color:var(--ink);font-weight:500}
  .toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut);padding-bottom:8px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
  .tab{padding:7px 13px;border-radius:20px;background:var(--chip);color:var(--mut);cursor:pointer;font-size:13px;border:1px solid transparent}
  .tab.on{background:var(--card2);color:var(--ink);border-color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 0;margin-bottom:16px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
  th{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  tr:last-child td{border-bottom:none}
  .price{font-weight:700;font-variant-numeric:tabular-nums}
  .rank{color:var(--mut);width:26px}
  .best .price{color:var(--accent)}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--mut)}
  .pill.off{background:#16321f;color:#7fd29a}
  .pill.magic{background:#3a2c12;color:#e8bd6e}
  .pill.peak{background:#2a2230;color:#c79ad4}
  .flag{color:var(--warn);font-size:11px}
  .note{color:var(--mut);font-size:12px;padding:4px 14px 10px}
  .zonegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:12px}
  .znum{font-size:12px;color:var(--accent2);font-weight:700;letter-spacing:.05em}
  .gymline{padding:8px 0;border-bottom:1px solid var(--line)}
  .gymline:last-child{border:none}
  .gymline a{color:var(--ink);text-decoration:none}
  .gymline a:hover{text-decoration:underline}
  .meta{color:var(--mut);font-size:12px}
  .hidden{display:none}
  footer{color:var(--mut);font-size:12px;margin-top:20px;line-height:1.6}
  a{color:var(--accent)}
  #map{height:400px;border-radius:10px;margin:0 12px 8px;z-index:0}
  .leaflet-popup-content{font:13px -apple-system,Arial,sans-serif}
  .startbar{display:flex;gap:8px;align-items:flex-end;padding:12px 14px 4px;flex-wrap:wrap}
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tscroll table{min-width:1180px}
  /* ---- phone / narrow screens ---- */
  @media (max-width:760px){
    .wrap{padding:12px 12px 48px}
    header{padding:16px 14px 10px}
    h1{font-size:19px}
    th,td{padding:7px 9px;font-size:13px}
    .card{overflow-x:auto;-webkit-overflow-scrolling:touch}  /* let wide tables scroll instead of clipping */
    .controls{gap:8px;padding:10px}
    .ctl input,.ctl select{min-width:0}
    .tab{padding:6px 11px;font-size:12px}
    #map{height:300px;margin:0 8px 8px}
    .zonegrid{grid-template-columns:1fr}
    .pill{font-size:10px}
  }
</style>
</head>
<body>
<header>
  <h1>London Climbing Gym Prices</h1>
  <div class="sub" id="meta"></div>
  <div class="sub" id="account"></div>
</header>
<div class="wrap">

  <div class="controls">
    <div class="ctl" style="flex:1;min-width:170px"><label>Your location (postcode or place) — public-transport travel times</label>
      <input type="text" id="startloc" placeholder="e.g. SW1A 1AA or &quot;Vauxhall station&quot;"></div>
    <button id="geoloc" class="ghost" title="Use your current location">Use my location</button>
    <div class="ctl"><label>Date</label><input type="date" id="date"></div>
    <div class="ctl"><label>Time</label><input type="time" id="time"></div>
    <div class="ctl"><label>Climber</label>
      <select id="who"><option value="adult">Adult</option><option value="conc">Student / concession</option></select>
    </div>
    <div class="ctl"><label>Type</label>
      <select id="type"><option value="">Any</option><option value="bouldering">Bouldering</option><option value="ropes">Ropes</option></select>
    </div>
    <div class="ctl"><label>Zone</label>
      <select id="zone"><option value="">Any</option></select>
    </div>
    <div class="ctl"><label>Cheapest mode</label>
      <select id="mode"><option value="day">Best price all day</option><option value="time">At selected time</option></select>
    </div>
    <button id="now" class="ghost">Now</button>
  </div>

  <div class="tabs">
    <div class="tab on" data-view="cheapest">Cheapest on this day</div>
    <div class="tab" data-view="map">Map &amp; directions</div>
    <div class="tab" data-view="all">All gyms</div>
    <div class="tab" data-view="offpeak">Off-peak &amp; cheap slots</div>
    <div class="tab" data-view="students">Student discounts</div>
    <div class="tab" data-view="memberships">Memberships &amp; passes</div>
    <div class="tab" data-view="promos">Limited offers</div>
    <div class="tab" data-view="events">Events</div>
    <div class="tab" data-view="classes">Classes</div>
    <div class="tab" data-view="routeset">Route setting</div>
  </div>

  <div id="view"></div>

  <footer id="foot"></footer>
</div>

/* ----- price logic (mirrors london_climbing_prices.py) ----- */
const toMin = s => { const [h,m]=s.split(":").map(Number); return h*60+m; };
function inWindow(day,mins,w){ if(!w) return false; if(!w.days.includes(day)) return false;
  return toMin(w.start)<=mins && mins<toMin(w.end); }
function offpeakWindows(gym){ const w=gym.offpeak_window; if(!w) return []; return Array.isArray(w)?w:[w]; }
let BANK_HOLIDAYS=null; // Set of "YYYY-MM-DD" (England & Wales), loaded from gov.uk
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function isBH(when){ return BANK_HOLIDAYS ? BANK_HOLIDAYS.has(ymd(when)) : false; }

function applicable(gym, when, conc){
  const day = WD[(when.getDay()+6)%7];           // JS Sun=0 -> our Mon=0
  const mins = when.getHours()*60 + when.getMinutes();
  const p = gym.payg;
  const bh = isBH(when);
  // magic slots
  let bestMagic=null;
  for(const s of (gym.magic_slots||[])){
    if(s.days.includes(day) && inWindow(day,mins,{days:s.days,start:s.start,end:s.end})){
      if(s.months && !s.months.includes(when.getMonth()+1)) continue;
      if(s.except_bank_holidays && bh) continue;
      const lbl=(s.label||"magic");
      if(lbl.toLowerCase().includes("concession") && !conc) continue;
      const full = /off[- ]?peak/i.test(lbl)
        ? (lbl+(s.prebook?" (pre-book)":""))
        : ("super off-peak ("+lbl+(s.prebook?", pre-book":"")+")");
      if(!bestMagic || s.price<bestMagic[0]) bestMagic=[s.price,full];
    }
  }
  if(bestMagic) return {price:bestMagic[0],label:bestMagic[1],kind:"magic"};
  const wins = offpeakWindows(gym);
  const isOff = wins.some(w=>inWindow(day,mins,w) && !(w.except_bank_holidays && bh));
  const concOnly = wins.some(w=>w.concession_only);
  let off,peak;
  if(conc){ off=p.concession_offpeak; peak=p.concession_peak; }
  else{ off=p.adult_offpeak; peak=p.adult_peak; if(concOnly) off=null; }
  if(isOff && off!=null) return {price:off,label:"off-peak",kind:"off"};
  if(peak!=null) return {price:peak,label:"peak",kind:"peak"};
  if(off!=null && wins.length===0) return {price:off,label:"off-peak",kind:"off"};
  return {price:null,label:"no data",kind:"none"};
}

function bestOnDay(gym, date, conc, step){
  step=step||15;
  const samples=[];
  for(let m=0;m<24*60;m+=step){
    const w=new Date(date.getFullYear(),date.getMonth(),date.getDate(),Math.floor(m/60),m%60);
    const r=applicable(gym,w,conc);
    if(r.price!=null) samples.push([m,r.price,r.label,r.kind]);
  }
  if(!samples.length) return null;
  const minp=Math.min(...samples.map(s=>s[1]));
  const first=samples.find(s=>s[1]===minp);
  let ranges=[],cur=null;
  for(const s of samples){ if(s[1]===minp){cur=cur?[cur[0],s[0]]:[s[0],s[0]];} else if(cur){ranges.push(cur);cur=null;} }
  if(cur) ranges.push(cur);
  const hhmm=x=>String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");
  let when;
  if(ranges.length===1 && ranges[0][0]===0 && ranges[0][1]>=24*60-step) when="any time";
  else when=ranges.map(r=>hhmm(r[0])+"-"+hhmm(Math.min(r[1]+step,24*60-1))).join("; ");
  return {price:minp,label:first[2],kind:first[3],when};
}
let START = (window.localStorage && localStorage.getItem('startLoc')) || '';
let START_COORD = null;  // [lat,lng] once geocoded
function dirLinks(g){
  const dest=encodeURIComponent(g.address||g.postcode||(g.lat+","+g.lng));
  const origin = START ? "&origin="+encodeURIComponent(START) : "";
  return {gmap:"https://www.google.com/maps/dir/?api=1"+origin+"&destination="+dest+"&travelmode=transit"};
}
function haversineKm(a,b){
  const R=6371,dLat=(b[0]-a[0])*Math.PI/180,dLng=(b[1]-a[1])*Math.PI/180;
  const s=Math.sin(dLat/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
function geocodeStart(cb){
  if(!START){START_COORD=null;cb&&cb();return;}
  fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gb&q="+encodeURIComponent(START))
    .then(r=>r.json()).then(j=>{ START_COORD = j&&j[0] ? [parseFloat(j[0].lat),parseFloat(j[0].lon)] : null; cb&&cb(); })
    .catch(()=>{ START_COORD=null; cb&&cb(); });
}

/* ----- transit travel time from START via TfL Journey Planner (no key) ----- */
let TRAVEL={}, TRAVEL_START=null, TRAVEL_LOADING=false;
// Real-time ("now") departure when it's currently 8am-11pm; otherwise a stable
// weekday 10:00 departure so overnight numbers stay sensible.
function tflDepart(){
  const h=new Date().getHours();
  if(h>=8 && h<23) return "";   // no params => TfL plans from now (real-time)
  const d=new Date(); d.setHours(10,0,0,0);
  while(d.getDay()===0||d.getDay()===6) d.setDate(d.getDate()+1);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), da=String(d.getDate()).padStart(2,"0");
  return "date="+y+m+da+"&time=1000&timeIs=Departing";
}
function runLimited(items, worker, limit, done){
  let idx=0, active=0, finished=0;
  (function next(){
    while(active<limit && idx<items.length){
      const it=items[idx++]; active++;
      worker(it, ()=>{ active--; finished++; if(finished===items.length) done&&done(); else next(); });
    }
  })();
}
function ensureTravel(){
  if(!START || TRAVEL_START===START || TRAVEL_LOADING) return;
  TRAVEL_LOADING=true; TRAVEL={}; const forStart=START;
  runLimited(DATA.gyms,(g,doneOne)=>{
    const to=g.postcode?encodeURIComponent(g.postcode):(g.lat+","+g.lng);
    fetch("https://api.tfl.gov.uk/Journey/JourneyResults/"+encodeURIComponent(forStart)+"/to/"+to+"?"+tflDepart())
      .then(r=>r.ok?r.json():Promise.reject())
      .then(j=>{ const d=j.journeys&&j.journeys[0]?j.journeys[0].duration:null; if(d!=null) TRAVEL[g.id]=d; })
      .catch(()=>{}).finally(doneOne);
  },4,()=>{ TRAVEL_START=forStart; TRAVEL_LOADING=false; render(); });
}
function travelStr(g){
  if(!START) return '';
  if(TRAVEL_START!==START) return TRAVEL_LOADING?'…':'';
  const m=TRAVEL[g.id]; return m!=null? m+" min":'—';
}
function startTxt(){ if(!START) return 'your location (set it at the top)'; return /^[-0-9.]+,[-0-9.]+$/.test(START)?'your location':('"'+esc(START)+'"'); }
function setStart(v){
  START=(v||'').trim();
  try{localStorage.setItem('startLoc',START);}catch(e){}
  START_COORD=null; TRAVEL_START=null; TRAVEL_LOADING=false;
  if(START) geocodeStart(()=>render());
  render(); ensureTravel();
}
function useMyLocation(){
  if(!navigator.geolocation){ alert("This browser can't share your location."); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    START=lat.toFixed(5)+","+lng.toFixed(5);
    START_COORD=[lat,lng];
    try{localStorage.setItem('startLoc',START);}catch(e){}
    const inp=el.getElementById("startloc"); if(inp) inp.value="My location";
    TRAVEL_START=null; TRAVEL_LOADING=false;
    render(); ensureTravel();
  }, err=>{ alert("Couldn't get your location: "+err.message+"\\nType a postcode instead."); }, {timeout:10000});
}

  for(const g of DATA.gyms){

      const b=bestOnDay(g,when,conc); if(!b) continue; rows.push({...b,g});

function fmtDeals(g){
  const sl=(g.magic_slots||[]);
  if(!sl.length) return '—';
  return sl.map(s=>{
    const allday = s.start==='00:00' && s.end==='23:59';
    const when = s.days.join(',')+(allday?' all day':(' '+s.start+'-'+s.end));
    const nm = s.label.replace(' (concession)','');
    return `<span class="price">${f(s.price)}</span> ${esc(nm)} ${when}`
      + (s.prebook?' (pre-book)':'')
      + (/concession/i.test(s.label)?' <span style="color:var(--accent2)">conc</span>':'')
      + (s.except_bank_holidays?' (not bank hols)':'');
  }).join('<br>');
}
function hoursSummary(g){
  const h=g.hours; if(!h) return '—';
  const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  let parts=[], i=0;
  while(i<7){
    const cur=h[days[i]]; let j=i;
    while(j+1<7 && JSON.stringify(h[days[j+1]])===JSON.stringify(cur)) j++;
    const lbl = i===j?days[i]:days[i]+"-"+days[j];
    parts.push(lbl+" "+(cur?cur[0]+"-"+cur[1]:"closed"));
    i=j+1;
  }
  return parts.join("; ")+(g.hours_assumed?" (approx)":"");
}
function openState(g, when){
  const h=g.hours; if(!h) return {open:null,txt:''};
  const day=WD[(when.getDay()+6)%7], t=h[day];
  const mins=when.getHours()*60+when.getMinutes();
  if(!t) return {open:false,txt:'closed today'};
  const o=toMin(t[0]), c=toMin(t[1]);
  if(mins<o) return {open:false,txt:'opens '+t[0]};
  if(mins>=c) return {open:false,txt:'closed'};
  return {open:true,txt:'open till '+t[1]};
}
function openBadge(g, when){
  const s=openState(g,when);
  if(s.open===null) return '';
  return ` <span class="pill ${s.open?'off':'peak'}">${s.txt}</span>`;
}

function initMap(){
  const box=el.getElementById("map"); if(!box) return;
  if(typeof L==="undefined"){ box.innerHTML='<div class="note">Map needs internet to load. Directions links still work.</div>'; renderMapList(); return; }
  if(MAP){ MAP.remove(); MAP=null; }
  MAP=L.map("map").setView([51.505,-0.09],11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(MAP);
  const conc=activeFilters().conc, when=whenFromInputs();
  const priced=DATA.gyms.map(g=>({g,b:bestOnDay(g,when,conc)})).filter(x=>x.b);
  const minp=Math.min(...priced.map(x=>x.b.price));
  const pts=[];
  DATA.gyms.forEach(g=>{
    const b=bestOnDay(g,when,conc);
    const cheap = b && b.price===minp;
    const d=dirLinks(g);
    const m=L.circleMarker([g.lat,g.lng],{radius:7,color:cheap?"#5db07a":"#e2a13c",fillColor:cheap?"#5db07a":"#e2a13c",fillOpacity:.85,weight:1}).addTo(MAP);
    m.bindPopup(`<b>${g.name}</b><br>${g.area} · zone ${g.zone}<br>Cheapest today: <b>${f(b?b.price:null)}</b>${b&&b.when?" ("+b.when+")":""}<br><a href="${d.gmap}" target="_blank">Directions</a> · <a href="${g.prices_url}" target="_blank">Prices</a>`);
    pts.push([g.lat,g.lng]);
  });
  const drawStart=()=>{
    if(START_COORD){
      L.marker(START_COORD).addTo(MAP).bindPopup("Start: "+START);
      MAP.fitBounds(pts.concat([START_COORD]),{padding:[30,30]});
    } else { MAP.fitBounds(pts,{padding:[30,30]}); }
    renderMapList();
  };
  if(START && !START_COORD) geocodeStart(drawStart); else drawStart();
}
