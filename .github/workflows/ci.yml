name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # For the Kotlin pricing parity test (android/core, run through Gradle).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install accessibility rules
        run: npm ci

      - name: Install browser for accessibility checks
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      # gyms.json is the single source of truth. Fail if generated data, gym
      # pages, the offline dashboard or .ics calendars have drifted.
      - name: Check derived files are in sync with gyms.json
        run: python3 tools/sync_data.py --check

      # Golden pricing tests + JS/Kotlin/Python parity (node and a JDK are on
      # the runner, so those parity tests always run in CI; Swift is skipped).
      - name: Run pricing tests
        run: python3 -m unittest discover -s tests -v

      - name: Run accessibility and responsive-layout checks
        run: python3 tools/accessibility_check.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Unit tests for the shared Kotlin code, then the debug APK. The runner
      # has the Android SDK preinstalled.
      - name: Test and build the Android app
        working-directory: android
        run: ./gradlew :core:test :app:assembleDebug

      # Download from the run's Summary page to install on a phone.
      - uses: actions/upload-artifact@v4
        with:
          name: climbing-finder-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
