name: Weekly price check

on:
  schedule:
    - cron: "0 9 * * 1"     # Mondays 09:00 UTC
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run price re-check
        run: |
          python london_climbing_prices.py check | tee report.txt
          {
            echo "### London climbing price check"
            echo ""
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue if prices changed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.txt', 'utf8');
            const changed = report.includes('TO REVIEW');
            const offers = report.includes('NEW OFFERS');
            if (changed || offers) {
              const today = new Date().toISOString().slice(0, 10);
              const what = changed && offers ? 'price changes and new offers'
                         : changed ? 'price changes' : 'new offers';
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Climbing ${what} detected (${today})`,
                body: "The weekly check found something that does not match the stored data.\n\n"
                      + "- **TO REVIEW** = a stored price is no longer on the gym's page.\n"
                      + "- **NEW OFFERS** = promo wording next to prices that are not in `gyms.json`.\n"
                      + "  Add real ones to `limited_promotions` (that also stops them being re-reported).\n\n"
                      + "Update `gyms.json`, run `python3 tools/sync_data.py`, then push.\n\n```\n" + report + "\n```",
              });
            }
