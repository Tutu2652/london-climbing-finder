<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>London Climbing Gym Prices</title>
<meta name="description" content="Compare pay-as-you-go prices, off-peak and student deals, memberships, and classes across 26 London climbing gyms — with a map and live public-transport travel times.">
<link rel="canonical" href="https://london-climbing-finder.pages.dev/">
<meta property="og:title" content="London Climbing Gym Prices">
<meta property="og:description" content="Find the cheapest London climbing gym on any day, plus off-peak & student deals, memberships, classes, and travel times.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://london-climbing-finder.pages.dev/">
<meta property="og:image" content="https://london-climbing-finder.pages.dev/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="London Climbing Gym Prices">
<meta name="twitter:description" content="Find the cheapest London climbing gym on any day, plus off-peak & student deals, memberships, classes, and travel times.">
<meta name="twitter:image" content="https://london-climbing-finder.pages.dev/assets/og-image.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%235db07a'/><text x='16' y='24' font-size='21' text-anchor='middle' fill='%2306210f' font-family='Arial,sans-serif' font-weight='bold'>&#163;</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "London Climbing Gym Prices",
  "url": "https://london-climbing-finder.pages.dev/",
  "applicationCategory": "SportsApplication",
  "operatingSystem": "Any",
  "offers": {"@type": "Offer", "price": "0", "priceCurrency": "GBP"},
  "description": "Compare pay-as-you-go prices, off-peak and student deals, memberships, and classes across 26 London climbing gyms."
}
</script>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<a class="skip-link" href="#view">Skip to results</a>
<header>
  <h1>London Climbing Gym Prices</h1>
  <div class="sub" id="meta"></div>
  <div class="sub" id="account"></div>
</header>
<div class="wrap">

  <div class="controls">
    <div class="ctl" style="flex:1;min-width:170px"><label for="startloc">Your location (postcode or place) — public-transport travel times</label>
      <input type="text" id="startloc" placeholder="e.g. SW1A 1AA or &quot;Vauxhall station&quot;"></div>
    <button id="geoloc" class="ghost" title="Use your current location">Use my location</button>
    <div class="ctl"><label for="date">Date</label><input type="date" id="date"></div>
    <div class="ctl"><label for="time">Time</label><input type="time" id="time"></div>
    <div class="ctl"><label for="who">Climber</label>
      <select id="who"><option value="adult">Adult</option><option value="conc">Student / concession</option></select>
    </div>
    <div class="ctl"><label for="type">Type</label>
      <select id="type"><option value="">Any</option><option value="bouldering">Bouldering</option><option value="ropes">Ropes</option></select>
    </div>
    <div class="ctl"><label for="zone">Zone</label>
      <select id="zone"><option value="">Any</option></select>
    </div>
    <div class="ctl"><label for="ac">Air‑conditioning</label>
      <!-- Air‑conditioning filter: "AC" shows all gyms with any level of air con, while "All" shows every gym regardless of AC. -->
      <select id="ac"><option value="">All</option><option value="ac">Any AC</option><option value="full">Full AC only</option></select>
    </div>
    <div class="ctl"><label for="mode">Cheapest mode</label>
      <select id="mode"><option value="day">Best price all day</option><option value="time">At selected time</option></select>
    </div>
    <button id="now" class="ghost">Now</button>
  </div>

  <div class="tabs" role="tablist" aria-label="Views">
    <button type="button" class="tab on" id="tab-cheapest" data-view="cheapest" aria-controls="view">Cheapest on this day</button>
    <button type="button" class="tab" id="tab-map" data-view="map" aria-controls="view">Map &amp; directions</button>
    <button type="button" class="tab" id="tab-all" data-view="all" aria-controls="view">All gyms &amp; deals</button>
    <button type="button" class="tab" id="tab-students" data-view="students" aria-controls="view">Student discounts</button>
    <button type="button" class="tab" id="tab-memberships" data-view="memberships" aria-controls="view">Memberships &amp; passes</button>
    <button type="button" class="tab" id="tab-promos" data-view="promos" aria-controls="view">Limited offers</button>
    <button type="button" class="tab" id="tab-classes" data-view="classes" aria-controls="view">Classes</button>
    <button type="button" class="tab" id="tab-whatson" data-view="whatson" aria-controls="view">Route setting &amp; events</button>
    <button type="button" class="tab" id="tab-calendar" data-view="calendar" aria-controls="view">Deals calendar</button>
  </div>

  <div class="legend" aria-hidden="true">
    Price colours: <span class="pill peak">peak</span>
    <span class="pill off">off-peak</span>
    <span class="pill magic">super off-peak / deal</span>
  </div>

  <div id="view" role="tabpanel" aria-labelledby="tab-cheapest" tabindex="-1"></div>

  <footer id="foot"></footer>
</div>

<!-- Scripts load here (end of body) so they don't block first paint. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- Optional account sync (Firebase). Harmless if not configured. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js" onerror="window.FIREBASE_CONFIG=window.FIREBASE_CONFIG||{}"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
